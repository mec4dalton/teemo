services:
  web:
    image: nginx:alpine
    ports:
      - "80:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: myapp-api:latest
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=secret
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
